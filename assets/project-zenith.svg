<svg width="600" height="380" viewBox="0 0 600 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="zenith-bg" x1="0" y1="0" x2="600" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="zenith-btn-grad" x1="0" y1="0" x2="160" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#zenith-bg)" />

  <!-- Component Card 1: Buttons & Switches -->
  <rect x="50" y="45" width="235" height="135" rx="14" fill="rgba(39, 39, 42, 0.6)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
  <text x="70" y="75" fill="#f43f5e" font-family="monospace" font-size="11">// UI.Buttons</text>
  <rect x="70" y="95" width="100" height="32" rx="8" fill="url(#zenith-btn-grad)" />
  <text x="95" y="115" fill="#fff" font-family="sans-serif" font-weight="bold" font-size="11">Primary</text>
  <rect x="180" y="95" width="85" height="32" rx="8" fill="#27272a" stroke="#52525b" stroke-width="1" />
  <text x="200" y="115" fill="#e4e4e7" font-family="sans-serif" font-size="11">Outline</text>
  <rect x="70" y="142" width="40" height="20" rx="10" fill="#10b981" />
  <circle cx="98" cy="152" r="8" fill="#fff" />
  <rect x="125" y="142" width="40" height="20" rx="10" fill="#3f3f46" />
  <circle cx="137" cy="152" r="8" fill="#a1a1aa" />

  <!-- Component Card 2: Glass Card Modal -->
  <rect x="310" y="45" width="240" height="135" rx="14" fill="rgba(39, 39, 42, 0.6)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
  <text x="330" y="75" fill="#38bdf8" font-family="monospace" font-size="11">// UI.Avatar &amp; Badges</text>
  <circle cx="355" cy="120" r="22" fill="#6366f1" />
  <circle cx="395" cy="120" r="22" fill="#ec4899" />
  <circle cx="435" cy="120" r="22" fill="#10b981" />
  <rect x="475" y="105" width="55" height="24" rx="12" fill="rgba(99, 102, 241, 0.2)" stroke="#6366f1" stroke-width="1" />
  <text x="487" y="121" fill="#818cf8" font-family="monospace" font-size="10">v2.4.0</text>

  <!-- Component Card 3: Form Inputs & Typography -->
  <rect x="50" y="200" width="500" height="140" rx="14" fill="rgba(39, 39, 42, 0.6)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
  <text x="70" y="230" fill="#a855f7" font-family="monospace" font-size="11">// UI.Inputs &amp; Selectors</text>
  
  <rect x="70" y="250" width="220" height="38" rx="8" fill="#18181b" stroke="#6366f1" stroke-width="1.5" />
  <text x="85" y="274" fill="#f4f4f5" font-family="sans-serif" font-size="12">Search components...</text>

  <rect x="310" y="250" width="220" height="38" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
  <text x="325" y="274" fill="#a1a1aa" font-family="sans-serif" font-size="12">Select theme (Dark)</text>
  <path d="M505 267 L512 274 L519 267" stroke="#a1a1aa" stroke-width="2" fill="none" stroke-linecap="round" />

  <rect x="70" y="305" width="70" height="18" rx="4" fill="rgba(244, 63, 94, 0.15)" />
  <text x="80" y="318" fill="#fb7185" font-family="monospace" font-size="10">Active</text>
  <rect x="150" y="305" width="70" height="18" rx="4" fill="rgba(16, 185, 129, 0.15)" />
  <text x="160" y="318" fill="#34d399" font-family="monospace" font-size="10">Success</text>
  <rect x="230" y="305" width="70" height="18" rx="4" fill="rgba(245, 158, 11, 0.15)" />
  <text x="240" y="318" fill="#fbbf24" font-family="monospace" font-size="10">Pending</text>
</svg>
