<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="avatar-bg" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#06070a" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="200" fill="url(#avatar-bg)" />
  
  <!-- Outer Glow Ring -->
  <circle cx="200" cy="200" r="190" stroke="url(#glow-grad)" stroke-width="4" stroke-dasharray="12 8" opacity="0.6" />
  <circle cx="200" cy="200" r="175" stroke="#6366f1" stroke-width="1.5" opacity="0.4" />

  <!-- Abstract Developer Avatar Character -->
  <!-- Shoulders & Hoodie -->
  <path d="M100 370 C100 290, 140 270, 200 270 C260 270, 300 290, 300 370 Z" fill="#1e293b" stroke="#334155" stroke-width="3" />
  <path d="M150 275 L200 340 L250 275" stroke="url(#glow-grad)" stroke-width="4" fill="none" opacity="0.8" />
  
  <!-- Neck -->
  <rect x="180" y="220" width="40" height="55" rx="10" fill="#334155" />

  <!-- Head / Face -->
  <rect x="140" y="110" width="120" height="130" rx="45" fill="#1e293b" stroke="#475569" stroke-width="3" />

  <!-- Cyber Visor / Glasses with Neon Glow -->
  <rect x="130" y="145" width="140" height="38" rx="19" fill="#0b0f19" stroke="url(#glow-grad)" stroke-width="3" filter="url(#glow-filter)" />
  <path d="M145 164 L255 164" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" opacity="0.9" />
  <circle cx="160" cy="164" r="5" fill="#6366f1" />
  <circle cx="240" cy="164" r="5" fill="#a855f7" />

  <!-- Cyber Hair / Tech headset -->
  <path d="M130 140 C130 80, 270 80, 270 140" stroke="#6366f1" stroke-width="12" stroke-linecap="round" fill="none" />
  <rect x="120" y="140" width="18" height="35" rx="8" fill="#38bdf8" />
  <rect x="262" y="140" width="18" height="35" rx="8" fill="#a855f7" />

  <!-- Tech Nodes Floating -->
  <circle cx="80" cy="120" r="6" fill="#6366f1" opacity="0.7" />
  <circle cx="320" cy="100" r="4" fill="#06b6d4" opacity="0.8" />
  <circle cx="330" cy="240" r="8" fill="#a855f7" opacity="0.6" />
</svg>
