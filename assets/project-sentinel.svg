<svg width="600" height="380" viewBox="0 0 600 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cli-bg" x1="0" y1="0" x2="600" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#cli-bg)" />

  <!-- Terminal Window -->
  <rect x="45" y="35" width="510" height="310" rx="12" fill="#0c0a09" stroke="#44403c" stroke-width="1.5" />
  
  <!-- Terminal Header -->
  <rect x="45" y="35" width="510" height="36" rx="12" fill="#1c1917" />
  <circle cx="70" cy="53" r="5" fill="#ef4444" />
  <circle cx="88" cy="53" r="5" fill="#f59e0b" />
  <circle cx="106" cy="53" r="5" fill="#10b981" />
  <text x="240" y="57" fill="#78716c" font-family="monospace" font-size="11">todd@devbox ~ sentinel scan</text>

  <!-- Terminal Body Content -->
  <g font-family="monospace" font-size="12">
    <text x="70" y="100" fill="#10b981">$ cloud-sentinel scan --region us-east-1 --all</text>
    <text x="70" y="125" fill="#a8a29e">[INFO] Connecting to AWS Cloud API Gateway...</text>
    <text x="70" y="145" fill="#a8a29e">[INFO] Auditing 148 IAM Roles, 32 S3 Buckets, 12 VPCs...</text>
    
    <text x="70" y="180" fill="#38bdf8">&gt; [PASSED] S3 Bucket Encryption (AES-256): 100% compliant</text>
    <text x="70" y="205" fill="#38bdf8">&gt; [PASSED] Multi-Factor Auth (MFA): Active on all admin accounts</text>
    <text x="70" y="230" fill="#f59e0b">&gt; [WARN]   Port 22 open on 0.0.0.0/0 in sg-08bfae (Instance: i-0294)</text>
    <text x="70" y="255" fill="#10b981">&gt; [AUTO-FIX] Generated Terraform security rule patch: /tmp/fix.tf</text>

    <!-- Progress Bar -->
    <rect x="70" y="280" width="380" height="14" rx="4" fill="#292524" />
    <rect x="70" y="280" width="380" height="14" rx="4" fill="#10b981" />
    <text x="465" y="292" fill="#10b981" font-size="11">100% DONE</text>

    <text x="70" y="325" fill="#e7e5e4">$ _</text>
  </g>
</svg>
